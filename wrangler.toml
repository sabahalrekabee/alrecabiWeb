# wrangler.toml
name = 'alrecabiweb'
compatibility_date = "2024-03-20"
main = "functions/api/[[route]].ts"

[assets]
directory = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "library-db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "PDF_KV"
id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
